[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "rill-cli"
version = "0.2.0"
description = "Standalone Rill software factory CLI"
requires-python = ">=3.14,<3.15"
dependencies = ["typer>=0.19", "rich>=14", "copier>=9.19.1"]

[project.scripts]
rill = "rill_cli.cli.app:app"

[dependency-groups]
dev = [
  "ruff",
  "pyright",
  "pytest",
  "pytest-cov",
  "pytest-xdist",
  "mutmut>=3.2.0",
  "pyinstaller>=6.17",
]

[tool.hatch.build.targets.wheel]
packages = ["src/py/rill_cli"]

[tool.hatch.build]
include = ["src/py/rill_cli/**"]

[tool.hatch.build.targets.wheel.force-include]
"standards/template" = "rill_cli/template"

[tool.ruff]
line-length = 100
target-version = "py314"
src = ["src/py", "src/rill_quality", "tests/py"]

[tool.ruff.lint]
select = [
  "E",
  "W",
  "F",
  "I",
  "UP",
  "B",
  "S",
  "C90",
  "PL",
  "SIM",
  "ASYNC",
  "RUF",
]

[tool.ruff.lint.mccabe]
max-complexity = 12

[tool.ruff.lint.pylint]
max-args = 5
max-branches = 12
max-statements = 50

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101", "PLR2004"]

[tool.pyright]
include = ["src/py/rill_cli", "src/rill_quality", "tests/py"]
typeCheckingMode = "strict"
venvPath = "."
venv = ".venv"
extraPaths = ["src", "src/py"]

[tool.pytest.ini_options]
addopts = "-n auto --strict-markers --tb=short"
testpaths = ["tests/py"]
pythonpath = ["src", "src/py"]

[tool.mutmut]
source_paths = ["src/rill_quality"]
pytest_add_cli_args_test_selection = ["tests/py"]
pytest_add_cli_args = ["-n", "0"]
