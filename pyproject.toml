[project]
name = "rill-local-quality"
version = "0.1.0"
requires-python = ">=3.14,<3.15"
dependencies = []

[dependency-groups]
dev = ["ruff", "pyright", "pytest", "pytest-cov", "pytest-xdist"]

[tool.ruff]
line-length = 100
target-version = "py314"
src = ["src/py", "tests/py"]

[tool.ruff.lint]
select = [
  "E",
  "W",
  "F",
  "I",
  "UP",
  "B",
  "S",
  "C90",
  "PL",
  "SIM",
  "ASYNC",
  "RUF",
]

[tool.ruff.lint.mccabe]
max-complexity = 12

[tool.ruff.lint.pylint]
max-args = 5
max-branches = 12
max-statements = 50

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101", "PLR2004"]

[tool.pyright]
include = ["src/py", "tests/py"]
typeCheckingMode = "strict"
venvPath = "."
venv = ".venv"
extraPaths = ["src/py"]

[tool.pytest.ini_options]
addopts = "-n auto --strict-markers --tb=short"
testpaths = ["tests/py"]
pythonpath = ["src/py"]
