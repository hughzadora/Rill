[tools]
bun = "1.4.5"
node = "24.22.3"
"aqua:gitleaks/gitleaks" = "8.30.1"
"aqua:google/osv-scanner" = "2.7.1"
"aqua:crate-ci/typos" = "1.52.2"
"aqua:lycheeverse/lychee" = "0.24.2"

[env]
TSRS_FAST = "0"

[tasks.build]
run = "bun run build"

[tasks.format]
run = "bun run format"

[tasks."format-check"]
run = "bun run format:check"

[tasks.lint]
run = "bun run lint"

[tasks."lint-fix"]
run = "bun run lint:fix"

[tasks.typecheck]
run = "bun run typecheck"

[tasks."check-fast"]
depends = ["format-check", "lint", "typecheck"]

[tasks.test]
run = "bun run test"

[tasks.qualify]
depends = ["test"]
run = "bun run test:qualification"

[tasks."scan-secrets"]
run = "gitleaks dir --redact=100 ."

[tasks."scan-history"]
run = "gitleaks git --redact=100 ."

[tasks."scan-dependencies"]
run = "osv-scanner scan source --recursive ."

[tasks.spelling]
run = "typos"

[tasks.links]
run = "lychee --offline --no-progress AGENTS.md README.md 'docs/**/*.md' 'workflow/**/*.md' '.agents/**/*.md' modern-ai-dlc-engineering-master-blueprint.md"

[tasks.verify]
depends = ["check-fast", "test", "scan-secrets", "scan-dependencies", "spelling", "links"]
