[tools]
bun = "1.4.5"
node = "24.22.3"
"pypi:specify-cli" = "1.4.5"
"aqua:gitleaks/gitleaks" = "8.30.1"
"aqua:rhysd/actionlint" = "1.7.12"
"aqua:koalaman/shellcheck" = "0.11.0" 
"aqua:zizmorcore/zizmor" = "1.33.1"
"aqua:google/osv-scanner" = "2.7.1"

[env]
TSRS_FAST = "0"

[tasks.setup]
run = "bun install --frozen-lockfile"

[tasks.verify]
depends = ["setup"]
run = [
  "specify workflow info speckit",
  "specify workflow info assess",
  "specify extension info assess",
  "bun run format:check",
  "bun run lint",
  "bun run typecheck",
  "bun run test",
  "gitleaks dir --redact=100 .",
  "osv-scanner scan source --recursive .",
  "actionlint",
  "zizmor --offline --min-severity medium .github/workflows",
]
