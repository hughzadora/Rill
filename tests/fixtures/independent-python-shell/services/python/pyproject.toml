[project]
name = "independent-python-service"
version = "0.1.0"
requires-python = ">=3.14,<3.15"

[dependency-groups]
dev = [
  "ruff==0.17.5",
  "mypy==2.4.1",
  "pytest==9.2.0",
  "pytest-cov==7.1.0",
  "hatchling==1.28.0",
  "pip-licenses==5.5.5",
]

[build-system]
requires = ["hatchling==1.28.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/independent_service"]
