id: no-hardcoded-secret
language: TypeScript
severity: error
message: Read the credential from the environment or the secret provider instead of hardcoding it in source.
note: Environment-backed values keep credentials out of the repository and let rotation happen in one place.
files:
  - src/**/*.ts
  - tests/**/*.ts
rule:
  any:
    - all:
        - kind: variable_declarator
        - has:
            field: name
            regex: ^(password|passwd|pwd|secret|token|api_key|apiKey|api_token|apiToken|access_token|accessToken|private_key|privateKey|credential|auth_token|authToken|access_key|accessKey)$
        - has:
            field: value
            kind: string
            regex: ^".{6,}"$
    - all:
        - kind: pair
        - has:
            field: key
            regex: ^(password|passwd|pwd|secret|token|api_key|apiKey|api_token|apiToken|access_token|accessToken|private_key|privateKey|credential|auth_token|authToken|access_key|accessKey)$
        - has:
            field: value
            kind: string
    - all:
        - kind: assignment_expression
        - has:
            field: right
            kind: string
        - has:
            field: left
            kind: member_expression
            has:
              field: property
              regex: ^(password|PASSWORD|passwd|pwd|secret|SECRET|token|TOKEN|api_key|apiKey|api_token|apiToken|access_token|accessToken|private_key|privateKey|credential|auth_token|authToken|access_key|accessKey)$
