id: no-unsafe-type-assertion
language: TypeScript
severity: error
message: Remove the unsafe type assertion and give the value a real type.
note: as any and as unknown as erase the type system, so they are intercepted before they ship.
files:
  - src/**/*.ts
  - tests/**/*.ts
rule:
  any:
    - all:
        - kind: as_expression
        - has:
            kind: predefined_type
            regex: ^any$
    - all:
        - kind: as_expression
        - has:
            kind: as_expression
