# Project-scoped native Codex defaults; host trust and approvals remain authoritative.
model = "gpt-6-luna"
model_reasoning_effort = "medium"

[agents]
enabled = true
max_threads = 3
max_depth = 1
default_subagent_model = "gpt-6-luna"
default_subagent_reasoning_effort = "medium"

[agents.explorer]
description = "Read-only, bounded module and source-location discovery."
config_file = "./agents/explorer.toml"

[agents.worker]
description = "Context-owned module implementation and its regression tests."
config_file = "./agents/worker.toml"

[agents.reviewer]
description = "Independent, read-only diff review after local full CI passes."
config_file = "./agents/reviewer.toml"

# Read-only upstream documentation; never a paid fallback.
[mcp_servers.openaiDeveloperDocs]
url = "https://developers.openai.com/mcp"
enabled = true
required = false
default_tools_approval_mode = "approve"

# Disable only the retired project-local Rill plugin, not the user's other plugins.
[plugins."rill@rill-local"]
enabled = false
