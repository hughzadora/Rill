# Project-scoped native Codex defaults; the host retains approval authority.
model = "gpt-6.2-sol"
model_reasoning_effort = "low"

[agents]
enabled = true
max_concurrent_threads_per_session = 1
default_subagent_model = "gpt-6-luna"
default_subagent_reasoning_effort = "high"

[agents.default]
description = "Bounded native general-purpose execution."
config_file = "./agents/default.toml"

[agents.explorer]
description = "Read-only source and official upstream exploration."
config_file = "./agents/explorer.toml"

[agents.risk_reviewer]
description = "Independent trust, migration and security review."
config_file = "./agents/risk-reviewer.toml"

[agents.worker]
description = "Bounded implementation and native tool execution."
config_file = "./agents/worker.toml"

[agents.reviewer]
description = "Independent evidence-based review of a completed candidate."
config_file = "./agents/reviewer.toml"

# Disable the superseded user-installed 0.1.2 runtime only in Rill.
[plugins."rill@rill-local"]
enabled = false
