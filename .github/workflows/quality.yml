name: Rill Quality

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  source:
    name: Typecheck, lint, real tests and per-file coverage
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout proposed source
        uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Set up native pnpm and Node.js
        uses: pnpm/setup@v1
        with:
          runtime: node@26
          cache: true
          install: false
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Verify actual source
        run: pnpm run ci
