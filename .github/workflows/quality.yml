name: Quality

on:
  pull_request:
  merge_group:

permissions:
  contents: read

jobs:
  quality:
    name: Full quality checks
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: jdx/mise-action@dba19683ed58901619b14f395a24841710cb4925 # v4.1.0
        with:
          install: false
      - name: Install locked tools
        run: mise exec --locked just -- just workspace-install
      - name: Run plugin and quality-package checks
        run: mise exec --locked just -- just workspace-ci
