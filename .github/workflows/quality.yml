name: Rill Quality

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  source:
    name: Typecheck, lint, real tests and per-file coverage
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout proposed source
        uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.5
      - name: Set up Node for isolated V8 coverage checks
        uses: actions/setup-node@v4
        with:
          node-version: '26'
      - name: Install locked dependencies
        run: bun install --frozen-lockfile
      - name: Verify actual source
        run: bun run ci
