name: CI guard

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tamper-check:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    timeout-minutes: 10
    steps:
      - name: Reject protected-path changes and test deletions
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const number = context.payload.pull_request.number;

            const { data: pr } = await github.rest.pulls.get({ owner, repo, pull_number: number });
            const approved = (pr.labels || []).some((label) => label.name === "gate-approved");
            if (approved) {
              core.notice("PR carries the gate-approved label; tamper checks are waived.");
              return;
            }

            const protectedFiles = [
              "lefthook.yml",
              ".oxlintrc.json",
              ".dependency-cruiser.cjs",
              ".gitleaks.toml",
              "stryker.config.json",
              "AGENTS.md",
            ];
            const violations = [];
            let page = 1;
            while (true) {
              const { data: files } = await github.rest.pulls.listFiles({
                owner,
                repo,
                pull_number: number,
                per_page: 100,
                page,
              });
              for (const file of files) {
                const changedProtected =
                  file.filename.startsWith(".github/") || protectedFiles.includes(file.filename);
                const deletedTest =
                  file.status === "removed" &&
                  (file.filename.startsWith("tests/") ||
                    /^template\/profiles\/[^/]+\/tests\//.test(file.filename));
                if (changedProtected || deletedTest) {
                  violations.push(`${file.status}: ${file.filename}`);
                }
              }
              if (files.length < 100) break;
              page += 1;
            }

            if (violations.length > 0) {
              core.setFailed(
                "This PR changes CODEOWNERS-protected paths or deletes existing tests " +
                  "without the gate-approved label:\n" +
                  violations.map((violation) => `- ${violation}`).join("\n"),
              );
            } else {
              core.notice("No protected-path changes or test deletions detected.");
            }

  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    timeout-minutes: 10
    steps:
      - name: Enforce runtime dependency allowlist
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const allowlist = ["@t3-oss/env-core"];

            const { data: pr } = await github.rest.pulls.get({
              owner,
              repo,
              pull_number: context.payload.pull_request.number,
            });

            async function readManifest(repository, ref) {
              const [repoOwner, repoName] = repository.split("/");
              const { data } = await github.rest.repos.getContent({
                owner: repoOwner,
                repo: repoName,
                path: "package.json",
                ref,
              });
              return JSON.parse(Buffer.from(data.content, "base64").toString("utf8"));
            }

            const headRepository = pr.head.repo ? pr.head.repo.full_name : `${owner}/${repo}`;
            const baseManifest = await readManifest(`${owner}/${repo}`, pr.base.sha);
            const headManifest = await readManifest(headRepository, pr.head.sha);
            const baseDependencies = baseManifest.dependencies || {};
            const headDependencies = headManifest.dependencies || {};
            const added = Object.keys(headDependencies).filter(
              (name) => !(name in baseDependencies),
            );
            const blocked = added.filter((name) => !allowlist.includes(name));
            if (blocked.length > 0) {
              core.setFailed(
                `PR adds runtime dependencies outside the allowlist (${allowlist.join(", ")}): ` +
                  blocked.join(", "),
              );
            } else {
              core.notice(
                added.length > 0
                  ? `Added runtime dependencies: ${added.join(", ")}`
                  : "No new runtime dependencies.",
              );
            }
      - name: Review vulnerabilities and licenses
        uses: actions/dependency-review-action@2031cfc080254a8a887f58cffee85186f0e49e48 # v4.9.0

  quality-gates:
    if: ${{ !cancelled() }}
    needs: [tamper-check, dependency-review]
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - name: Assert Apple Silicon arm64
        run: test "$(uname -m)" = "arm64"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: ./.github/actions/locked-setup
      - name: Run quality gates
        run: |
          mise run verify
          mise run build
          mise run scan-history
          bun run api-extractor
          test -z "$(git status --porcelain)"
