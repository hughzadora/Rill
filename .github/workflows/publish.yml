name: Publish npm package

on:
  workflow_dispatch:
    inputs:
      package:
        description: Exact npm workspace package name
        required: true
        type: string

permissions:
  contents: read

jobs:
  publish:
    if: github.ref == 'refs/heads/main' && vars.NPM_PUBLISH_ENABLED == 'true'
    environment: npm-publish
    env:
      NPM_PACKAGE: ${{ inputs.package }}
    permissions:
      contents: read
      id-token: write
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: jdx/mise-action@5228313ee0372e111a38da051671ca30fc5a96db # v3
        with:
          cache: false
          install_args: --locked
      - run: mise run prepare
      - name: Validate publish input
        run: bun tooling/workflow-inputs.mts publish
      - run: mise run qualify
      - run: bun run build
      - name: Publish workspace package
        run: npm publish --workspace="$NPM_PACKAGE" --access public --provenance
