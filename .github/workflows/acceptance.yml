name: Rill acceptance
on:
  pull_request:
  push:
    branches: [main, integration/ai-dlc-foundation]
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: $/.github/actions/locked-setup
      - name: Verify the candidate
        run: |
          mise run verify
          mise run scan-history
          test -z "$(git status --porcelain)"
  qualification:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: $/.github/actions/locked-setup
      - name: Qualify rejection of invalid changes
        run: |
          mise run qualify
          test -z "$(git status --porcelain)"
  artifact:
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: $/.github/actions/locked-setup
      - name: Build and validate the Rill kit
        run: |
          mise run build
          (cd dist && shasum -a 256 -c rill-kit-*.tar.gz.sha256)
          test -z "$(git status --porcelain)"
  acceptance:
    name: acceptance
    if: ${{ always() }}
    needs: [verify, qualification, artifact]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 1
      - name: Require each review gate to succeed
        env:
          REQUIRED_RESULTS: ${{ toJSON(needs) }}
        run: |
          node .github/scripts/require-results.js
