name: Rill release
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  quality:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: jdx/mise-action@dba19683ed58901619b14f395a24841710cb4925 # v4.1.0
        with:
          install: false
      - run: mise exec --locked just -- just setup
      - run: mise exec --locked just -- just ci-full
  build:
    needs: quality
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: ubuntu-24.04, platform: linux-x64}
          - {os: ubuntu-24.04-arm, platform: linux-arm64}
          - {os: macos-15-intel, platform: macos-x64}
          - {os: macos-15, platform: macos-arm64}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v6
      - run: uv python install 3.14
      - run: uv sync --locked --all-extras --dev
      - run: uv run pyinstaller --noconfirm --clean --specpath build --onedir --name rill --paths src/py --collect-all copier --collect-all rich --collect-all typer --collect-all jinja2_ansible_filters --add-data "standards/template:rill_cli/template" src/py/rill_cli/__main__.py
      - name: Cold binary lifecycle smoke
        shell: bash
        run: |
          set -euo pipefail
          test "$(env -u VIRTUAL_ENV dist/rill/rill version)" = "${GITHUB_REF_NAME#v}"
          target="$(mktemp -d)"
          env -u VIRTUAL_ENV dist/rill/rill init "$target" --yes
          git -C "$target" -c core.hooksPath=/dev/null add -A
          git -C "$target" -c core.hooksPath=/dev/null -c user.name=ReleaseTest -c user.email=release@example.invalid commit -qm initial
          env -u VIRTUAL_ENV dist/rill/rill upgrade "$target" --yes
          env -u VIRTUAL_ENV dist/rill/rill status "$target"
      - run: tar -czf "rill-${{ matrix.platform }}.tar.gz" -C dist rill
      - uses: actions/upload-artifact@v4
        with:
          name: rill-${{ matrix.platform }}
          path: rill-${{ matrix.platform }}.tar.gz
  publish:
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: rill-*
          merge-multiple: true
      - run: sha256sum rill-*.tar.gz > SHA256SUMS.txt
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            rill-*.tar.gz
            SHA256SUMS.txt
