name: Rill release
on:
  push:
    tags: ['v*']
concurrency:
  group: rill-cli-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  quality:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Pin tag regression baseline to the previous commit
        shell: bash
        run: echo "RILL_CI_BASE_SHA=$(git rev-parse HEAD^)" >> "$GITHUB_ENV"
      - uses: jdx/mise-action@dba19683ed58901619b14f395a24841710cb4925 # v4.1.0
        with:
          install: false
      - if: startsWith(github.ref, 'refs/tags/v')
        run: test "$GITHUB_REF_NAME" = "v$(cat VERSION)"
      - run: mise exec --locked just -- just setup
      - run: mise exec --locked just -- just ci-full
      - name: Preserve full Python dependency license inventory
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: python-license-audit
          path: build/reports/python-licenses.json
          if-no-files-found: warn
  build:
    needs: quality
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: ubuntu-24.04, platform: linux-x64}
          - {os: ubuntu-24.04-arm, platform: linux-arm64}
          - {os: macos-26, platform: macos-arm64}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v6
      - uses: jdx/mise-action@dba19683ed58901619b14f395a24841710cb4925 # v4.1.0
        with:
          install: false
      - run: mise exec --locked just -- just build-cli
      - name: Cold binary lifecycle smoke
        shell: bash
        run: |
          set -euo pipefail
          env -u VIRTUAL_ENV dist/rill/rill --json version | python3 -c 'import json,sys,pathlib; assert json.load(sys.stdin)["version"] == pathlib.Path("VERSION").read_text().strip()'
          target="$(mktemp -d)"
          trap 'rm -rf -- "$target"' EXIT
          env -u VIRTUAL_ENV dist/rill/rill init "$target" --yes
          test "$(git -C "$target" log -1 --format=%s)" = "chore(rill): initialize harness"
          test -z "$(git -C "$target" status --porcelain)"
          env -u VIRTUAL_ENV dist/rill/rill ui "$target" --no-open
          test -s "$target/.rill/dashboard.html"
          mise exec --locked node pnpm python uv just -- env -u VIRTUAL_ENV dist/rill/rill doctor "$target"
          (cd "$target" && env -u VIRTUAL_ENV "$GITHUB_WORKSPACE/dist/rill/rill" hook session-start </dev/null)
          (cd "$target" && env -u VIRTUAL_ENV "$GITHUB_WORKSPACE/dist/rill/rill" hook pre-compact </dev/null)
          (cd "$target" && env -u VIRTUAL_ENV "$GITHUB_WORKSPACE/dist/rill/rill" hook stop </dev/null)
          env -u VIRTUAL_ENV dist/rill/rill upgrade "$target" --yes
          env -u VIRTUAL_ENV dist/rill/rill status "$target"
          test -z "$(git -C "$target" status --porcelain)"
      - run: tar -czf "rill-${{ matrix.platform }}.tar.gz" -C dist rill
      - uses: actions/upload-artifact@v4
        with:
          name: rill-${{ matrix.platform }}
          path: rill-${{ matrix.platform }}.tar.gz
  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: rill-*
          merge-multiple: true
      - run: sha256sum rill-*.tar.gz > SHA256SUMS.txt
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            rill-*.tar.gz
            SHA256SUMS.txt
