name: Install the locked Rill toolchain
description: Install the candidate's runtime and dependencies without rewriting locks
runs:
  using: composite
  steps:
    - uses: jdx/mise-action@924e7c586e33d7d4bae9c14e26c5d22e2beb6e78 # v5.3.0
      with:
        version: 2026.11.14
        cache: "false"
        install: "false"
    - name: Install and validate the locks
      shell: bash
      run: bash "$GITHUB_ACTION_PATH/install.sh"
