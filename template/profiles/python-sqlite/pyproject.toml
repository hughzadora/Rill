[project]
name = "rill-sqlite-tasks"
version = "0.1.0"
description = "Durable task-list fixture for the Rill Python SQLite profile"
requires-python = ">=3.13,<3.14"
dependencies = []

[project.scripts]
rill-tasks = "rill_sqlite_tasks.cli:main"

[build-system]
requires = ["uv_build==0.13.10"]
build-backend = "uv_build"

[dependency-groups]
dev = [
  "hypothesis==6.170.17",
  "mutmut==3.8.1",
  "pyright==1.1.414",
  "pytest==9.2.0",
  "ruff==0.17.6",
  "uv_build==0.13.10",
]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP"]

[tool.pyright]
include = ["src"]
pythonVersion = "3.13"
extraPaths = ["src"]
venvPath = "."
venv = ".venv"
typeCheckingMode = "strict"

[tool.pytest.ini_options]
testpaths = ["tests/behavior"]
pythonpath = ["tests/tooling"]
addopts = ["--strict-config", "--strict-markers"]

[tool.mutmut]
source_paths = ["src/rill_sqlite_tasks/requests.py"]
pytest_add_cli_args = ["-p", "hypothesispytest"]
pytest_add_cli_args_test_selection = ["tests/behavior/test_requests.py"]
