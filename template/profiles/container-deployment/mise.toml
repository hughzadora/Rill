[tools]
"aqua:aquasecurity/trivy" = "0.76.2"
"aqua:docker/cli" = "29.10.1"
"aqua:docker/buildx" = "0.39.1"
"aqua:jqlang/jq" = "1.8.2"
"aqua:koalaman/shellcheck" = "0.11.0"
"aqua:mvdan/sh" = "3.14.1"
"aqua:oxc-project/oxc/oxfmt" = "0.80.0"
"aqua:gitleaks/gitleaks" = "8.30.1"
"aqua:crate-ci/typos" = "1.52.2"
"aqua:lycheeverse/lychee" = "0.24.2"

[tasks.format]
run = "shfmt -w -i 2 scripts tests && oxfmt --write README.md trivy.yaml"

[tasks.check-fast]
run = [
  "shfmt -d -i 2 scripts tests",
  "shellcheck scripts/*.sh tests/*.sh",
  "oxfmt --check README.md trivy.yaml mise.toml",
  "typos README.md mise.toml trivy.yaml image scripts tests",
  "lychee --offline --no-progress README.md",
]

[tasks.scan-secrets]
run = "gitleaks dir --redact=100 ."

[tasks.build]
run = "bash scripts/image.sh build image"

[tasks.test]
run = "bash tests/profile.sh verify"

[tasks.verify]
depends = ["check-fast", "scan-secrets", "test"]

[tasks.qualify-iac]
run = "bash tests/profile.sh iac"

[tasks.qualify]
run = "bash tests/profile.sh qualify"
