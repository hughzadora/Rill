[tools]
"core:rust" = "1.100.0"
"aqua:EmbarkStudios/cargo-deny" = "0.22.1"
"cargo:cargo-mutants" = { version = "27.1.0", locked = true }
"aqua:oxc-project/oxc/oxfmt" = "0.80.0"
"aqua:gitleaks/gitleaks" = "8.30.1"
"aqua:crate-ci/typos" = "1.52.2"
"aqua:lycheeverse/lychee" = "0.24.2"
"aqua:koalaman/shellcheck" = "0.11.0"
"aqua:mvdan/sh" = "3.13.0"

[settings.cargo]
binstall = false

[tasks.build]
run = "cargo build --workspace --release --locked --target-dir target"

[tasks.format]
run = ["cargo fmt --all", "oxfmt --write .", "shfmt -i 2 -w tests/tooling"]

[tasks.format-check]
run = ["cargo fmt --all -- --check", "oxfmt --check .", "shfmt -i 2 -d tests/tooling"]

[tasks.typecheck]
run = "cargo check --workspace --all-targets --locked"

[tasks.lint]
run = [
  "cargo clippy --workspace --all-targets --locked -- -D warnings",
  "shellcheck -s bash tests/tooling/*.sh",
]

[tasks.check-fast]
depends = ["format-check", "typecheck", "lint"]

[tasks.test]
run = "bash tests/tooling/check-tests.sh"

[tasks."test:behavior"]
run = "cargo test --workspace --locked --test batching --test cli"

[tasks.scan-secrets]
run = "gitleaks dir --config .gitleaks.toml --redact=100 ."

[tasks.scan-history]
run = "gitleaks git --config .gitleaks.toml --redact=100 ."

[tasks.scan-dependencies]
run = "cargo deny --locked check --show-stats"

[tasks.spelling]
run = "typos --exclude target --exclude reports --exclude modern-ai-dlc-engineering-master-blueprint.md"

[tasks.links]
run = "lychee --offline --no-progress '*.md' 'docs/**/*.md' 'workflow/**/*.md' '.agents/**/*.md'"

[tasks.verify]
depends = ["check-fast", "test", "scan-secrets", "scan-dependencies", "spelling", "links"]

[tasks.qualify]
depends = ["build"]
run = "bash tests/tooling/qualify.sh"
