[tools]
bun = "1.4.5"
node = "24.22.3"
"aqua:crate-ci/typos" = "1.52.2"
"aqua:gitleaks/gitleaks" = "8.30.1"
"aqua:google/osv-scanner" = "2.7.1"
"aqua:lycheeverse/lychee" = "0.24.2"
"github:oasdiff/oasdiff" = "1.41.0"

[env]
TSRS_FAST = "0"
OXLINT_TSGOLINT_PATH = "{{config_root}}/node_modules/.bin/tsrs-lint"

[tasks.dev]
run = "bun run dev"

[tasks.format]
run = "bun run format"

[tasks.format-check]
run = "bun run format:check"

[tasks.lint]
run = "bun run lint"

[tasks.lint-fix]
run = "bun run lint:fix"

[tasks.typecheck]
run = "bun run typecheck"

[tasks.architecture]
run = "bun run architecture"

[tasks.check-fast]
depends = ["format-check", "lint", "typecheck", "architecture"]

[tasks.test]
run = "bun run test"

[tasks.mutation]
run = "bun run test:mutation"

[tasks.openapi-drift]
run = "bun run openapi:check"

[tasks.openapi-lint]
run = "bun run openapi:lint"

[tasks.openapi-compatibility]
run = "bun run openapi:compatibility"

[tasks.api-contract]
depends = ["openapi-drift", "openapi-lint", "openapi-compatibility"]

[tasks.unused]
run = "bun run unused"

[tasks.spelling]
run = "typos"

[tasks.links]
run = "lychee --offline --no-progress README.md"

[tasks.scan-secrets]
run = "gitleaks dir --redact=100 ."

[tasks.scan-history]
run = "gitleaks git --redact=100 ."

[tasks.scan-dependencies]
run = "osv-scanner scan source --lockfile bun.lock"

[tasks.verify]
depends = [
  "check-fast",
  "test",
  "api-contract",
  "unused",
  "spelling",
  "links",
  "scan-secrets",
  "scan-dependencies",
]

[tasks.qualify]
depends = ["test", "mutation"]
run = "bun run test:qualification"
