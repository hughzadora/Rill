id: no-preview-write-tsx
valid:
  - |
    import { write as saveFile } from "bun";
    export function previewExport(path: string) { return <span>{Bun.file(path).name}</span>; }
    export function saveExport(path: string, data: string) { return saveFile(path, data); }
  - |
    function write(data: string) { return data.trim(); }
    function previewExport(data: string) { return <span>{write(data)}</span>; }
invalid:
  - |
    function previewExport() { return <button onClick={() => Bun.write("output.txt", "sample")} />; }
  - |
    function previewExport() { return <button onClick={() => Bun['write']("output.txt", "sample")} />; }
  - |
    import { write } from "bun";
    function previewExport() { return <button onClick={() => write("output.txt", "sample")} />; }
  - |
    import { write as saveFile } from 'bun';
    function previewExport() { return <button onClick={() => saveFile("output.txt", "sample")} />; }
