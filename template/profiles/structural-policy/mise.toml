[tools]
bun = "1.4.5"
node = "24.22.3"
"aqua:ast-grep/ast-grep" = "0.51.3"
"aqua:crate-ci/typos" = "1.52.2"
"aqua:gitleaks/gitleaks" = "8.30.1"
"aqua:google/osv-scanner" = "2.7.1"

[env]
TSRS_FAST = "0"
OXLINT_TSGOLINT_PATH = "{{config_root}}/node_modules/.bin/tsrs-lint"

[tasks.dev]
run = "mise exec -- bun run dev"

[tasks.format]
run = "mise exec -- bun run format"

[tasks.format-check]
run = "mise exec -- bun run format:check"

[tasks.lint]
run = "mise exec -- bun run lint"

[tasks.lint-fix]
run = "mise exec -- bun run lint:fix"

[tasks.typecheck]
run = "mise exec -- bun run typecheck"

[tasks.scan-structure]
run = "mise exec -- bun run scan:structure"

[tasks.check-fast]
depends = ["format-check", "lint", "typecheck", "scan-structure"]

[tasks.test]
run = "mise exec -- bun run test"

[tasks.unused]
run = "mise exec -- bun run unused"

[tasks.spelling]
run = "mise exec -- typos"

[tasks.scan-secrets]
run = "mise exec -- gitleaks dir --redact=100 --verbose ."

[tasks.scan-history]
run = "mise exec -- gitleaks git --redact=100 ."

[tasks.scan-dependencies]
run = "mise exec -- osv-scanner scan source --lockfile bun.lock"

[tasks.verify]
depends = ["check-fast", "test", "unused", "spelling", "scan-secrets", "scan-dependencies"]

[tasks.qualify]
run = "mise exec -- bun run test:qualification"
