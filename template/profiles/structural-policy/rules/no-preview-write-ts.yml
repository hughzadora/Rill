id: no-preview-write-ts
language: TypeScript
severity: error
message: Keep preview functions read-only. Move the Bun write call to a save function.
rule:
  all:
    - any:
        - pattern: Bun.write($$$ARGS)
        - kind: call_expression
          has:
            field: function
            kind: subscript_expression
            all:
              - has: { field: object, regex: ^Bun$ }
              - has:
                  field: index
                  regex: ^['"]write['"]$
        - all:
            - pattern: $WRITE($$$ARGS)
            - inside:
                kind: program
                stopBy: end
                has:
                  kind: import_statement
                  has:
                    field: source
                    regex: ^['"]bun['"]$
                  all:
                    - has:
                        kind: import_specifier
                        stopBy: end
                        any:
                          - pattern:
                              context: import { write as $WRITE } from "bun"
                              selector: import_specifier
                          - all:
                              - pattern: $WRITE
                              - regex: ^write$
    - inside:
        kind: function_declaration
        has:
          field: name
          regex: ^preview[A-Z]
        stopBy: end
